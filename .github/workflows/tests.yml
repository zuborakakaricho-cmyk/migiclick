name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: OSの道具（.github/apt-packages.txt に1行1つ。無ければ飛ばす）
        run: |
          if [ -f .github/apt-packages.txt ]; then
            sudo apt-get update && xargs -a .github/apt-packages.txt sudo apt-get install -y
          fi
      - name: Pythonのテスト
        run: |
          python -m pip install pytest
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi
          python -m pytest -q tests
      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: "22"
      - name: Nodeのテスト（package.json があるときだけ）
        if: hashFiles('package.json') != ''
        run: npm ci && npm test

  windows:
    # Windows（試験的）：入れる → 右クリックに入った命令そのままで6つ＋「送る」のまとめて → 外す、まで通るか
    # 借りるWindowsに Claude Code は無いので、Claude の2つは「頼み方を作る」「手元で名前を拾う」側で確かめる
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: 入れる（「Windowsに入れる.cmd」の中身と同じ）
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\install.ps1
      - name: Pythonのテスト（入れたPythonで）
        shell: pwsh
        run: |
          $py = "$env:LOCALAPPDATA\migiclick\python\python.exe"
          & $py -m pip install --quiet pytest numpy
          & $py -m pytest -q tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 右クリックのメニューから動かす
        shell: pwsh
        run: ./.github/windows_check.ps1
      - name: 外す（「Windowsから外す.cmd」の中身と同じ）
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\install.ps1 -Remove
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $left = Get-ChildItem 'HKCU:\Software\Classes\SystemFileAssociations' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -eq 'migiclick' }
          if ($left) { throw "メニューが残っています：$($left.Name)" }
          if (Test-Path "$env:LOCALAPPDATA\migiclick") { throw '入れた場所が残っています' }
          if (Get-ChildItem ([Environment]::GetFolderPath('SendTo')) -Filter '右クリックで事務*') { throw '「送る」が残っています' }
          Write-Host '外せました'

  windows-ja:
    # 日本語のWindowsに寄せて試す：ユーザー名が日本語でスペース入り（入れる場所・試すファイルの場所も日本語）、
    # 表示の言語と地域は日本語、コマンドの窓は Shift_JIS（932）。借りるWindowsの中の文字コードまでは日本語にできない
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: 日本語に寄せる
        shell: pwsh
        run: |
          $u = Join-Path (Split-Path $env:USERPROFILE) '田中 花子'
          New-Item -ItemType Directory -Force "$u\AppData\Local", "$u\Desktop\会議 資料" | Out-Null
          Add-Content $env:GITHUB_ENV "LOCALAPPDATA=$u\AppData\Local" -Encoding utf8
          Add-Content $env:GITHUB_ENV "WORK=$u\Desktop\会議 資料" -Encoding utf8
          Set-Culture ja-JP
          Set-WinUserLanguageList ja-JP -Force
          Set-WinHomeLocation -GeoId 122
          Get-Culture | Format-List Name, DisplayName
      - name: 入れる（Shift_JIS の窓から）
        shell: cmd
        run: |
          chcp 932
          echo %LOCALAPPDATA%
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\install.ps1
      - name: 右クリックのメニューから動かす
        shell: pwsh
        run: |
          Get-ItemProperty 'HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\migiclick\shell\*\command' | ForEach-Object { $_.'(default)' }
          ./.github/windows_check.ps1 -Work $env:WORK
      - name: 外す
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\install.ps1 -Remove
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path "$env:LOCALAPPDATA\migiclick") { throw '入れた場所が残っています' }
          if (Get-ChildItem ([Environment]::GetFolderPath('SendTo')) -Filter '右クリックで事務*') { throw '「送る」が残っています' }
          Write-Host '外せました'
