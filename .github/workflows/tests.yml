name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OSの道具（.github/apt-packages.txt に1行1つ。無ければ飛ばす）
        run: |
          if [ -f .github/apt-packages.txt ]; then
            sudo apt-get update && xargs -a .github/apt-packages.txt sudo apt-get install -y
          fi
      - name: Pythonのテスト
        run: |
          python -m pip install pytest
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "22"
      - name: Nodeのテスト（package.json があるときだけ）
        if: hashFiles('package.json') != ''
        run: npm ci && npm test
